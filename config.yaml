data:
  retention:
    n_students: 10000
    n_semesters: 4
    missing_exit_rate: 0.35
    n_schools: 6
    school_names:
      - "College of Arts & Sciences"
      - "School of Engineering"
      - "School of Business"
      - "School of Health"
      - "School of Education"
      - "College of Liberal Arts"
  lead_scoring:
    n_leads: 15000
    enrollment_rate: 0.15

model:
  retention:
    early_semester_features: 15
    mid_semester_features: 25
    test_size: 0.2
    val_size: 0.15
    random_state: 42
  lead_scoring:
    test_size: 0.2
    val_size: 0.15
    random_state: 42

paths:
  data_dir: "data"
  models_dir: "models"
  outputs_dir: "outputs"
